name: Feature Request
description: Suggest an idea or improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for OneNotificationListFFS? Describe what you want and why it would improve the tweak.

  - type: textarea
    id: idea
    attributes:
      label: What would you like added or changed?
      placeholder: "Describe the feature or improvement."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      placeholder: "Explain the problem this solves or the experience it improves."
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: How should it behave?
      description: If you have a specific interaction or Settings option in mind, describe it here.
    validations:
      required: false

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "Example: iOS 16.3.1"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Extra details
      description: Mockups, screenshots, or similar tweak examples can help.
    validations:
      required: false

