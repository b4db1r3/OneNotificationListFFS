name: Bug Report
description: Report something that is not working correctly.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce the issue.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue clearly.
      placeholder: "Example: After relocking, notifications moved into history instead of staying visible."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Example: Notifications should stay visible on the Lock Screen."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Lock the device
        2. Receive notifications
        3. Unlock and relock
        4. ...
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "Example: iOS 16.3.1"
    validations:
      required: true

  - type: input
    id: jailbreak
    attributes:
      label: Jailbreak / environment
      placeholder: "Example: Dopamine rootless, palera1n rootful, RootHide"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Drag files here if they help explain the issue.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Extra details
      description: Add anything else that might help.
    validations:
      required: false

